<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Rosario tab icon: a loop of ten beads (one decade), the centre medal and
     the cross. Drawn on a 2-unit pixel grid so edges stay sharp at 1.5x. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="48" height="48" viewBox="0 0 48 48" shape-rendering="crispEdges" fill="#000000">
  <rect x="18" y="2" width="4" height="4"/>
  <rect x="26" y="2" width="4" height="4"/>
  <rect x="10" y="6" width="4" height="4"/>
  <rect x="34" y="6" width="4" height="4"/>
  <rect x="6" y="12" width="4" height="4"/>
  <rect x="38" y="12" width="4" height="4"/>
  <rect x="10" y="18" width="4" height="4"/>
  <rect x="34" y="18" width="4" height="4"/>
  <rect x="18" y="22" width="4" height="4"/>
  <rect x="26" y="22" width="4" height="4"/>
  <rect x="22" y="26" width="4" height="4"/>
  <rect x="22" y="32" width="4" height="14"/>
  <rect x="18" y="36" width="12" height="4"/>
</svg>
